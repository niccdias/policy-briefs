name: Deploy briefs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Require closed findings and independent release approval
        run: node pilot/publication-gate.mjs
      - name: Generate matching public briefs from the approved release
        run: node pilot/public-view.mjs --write
      - name: Build Quartz
        run: npm run quartz -- build
      - name: Install coding pilot dependencies
        run: npm ci --prefix pilot
      - name: Check coding semantics and preservation
        run: npm test --prefix pilot
      - name: Build coding view and verify shared release parity
        run: npm run build --prefix pilot
      - name: Require verified decision-review packages
        run: node decision-review/publication-gate.mjs
      - name: Check guided review decisions and saved sessions
        run: node --test decision-review/runtime/*.test.mjs
      - name: Build guided reviews for all eight bills
        run: node decision-review/build-site.mjs --out public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
